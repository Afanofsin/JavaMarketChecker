<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CS:GO Skins</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"/>
</head>
<body>
<header class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand ms-2" href="/">Skin Scraper</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/search/cases">Cases</a></li>
            <li class="nav-item"><a class="nav-link" href="/search/skins">Skins</a></li>
        </ul>
    </div>
</header>

<main class="container">
    <h1 class="text-center my-4">Available Weapon Skins</h1>

    <form method="get" th:action="@{/search/skins}" class="d-flex justify-content-center">
        <input class="form-control w-25" type="search" name="weaponName" placeholder="Search weapon..." aria-label="Weapon Name">
        <input class="form-control w-25" type="search" name="skinName" placeholder="Search skin..." aria-label="Search">
        <input class="form-control w-25" type="number" name="limiter" placeholder="Limiter..." aria-label="Limiter">
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">
                Search
            </button>
        </div>
    </form>

    <div class="row mt-4 g-3">
        <p th:if="${error}" th:text="${error}"></p>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
            <div class="col-md-4" th:each="skinItem : ${skins}">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${skinItem.getName()}">Skin Name</h5>
                        <p class="card-text text-muted" th:text="'ID: ' + ${skinItem.getId()}"></p>
                        <div class="form-check">
                            <input type="checkbox" name="caseIds" th:value= "${skinItem.getId()}" class="form-check-input">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-grid gap-2 col-6 mx-auto">
            <div class="btn-group">
                <input type="hidden" name="findType" id="findType" value="Factory New">
                <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split mt-3" data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="selectedOption">Factory New</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="setFindType('Factory New')">Factory New</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setFindType('Minimal Wear')">Minimal Wear</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setFindType('Field-Tested')">Field-Tested</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setFindType('Well-Worn')">Well-Worn</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setFindType('Battle-Scarred')">Battle-Scarred</a></li>
                </ul>
                <button type="button" class="btn btn-primary mt-3" id="submitBtn">
                    Process Selected Skins
                </button>
            </div>
        </div>
    </div>
</main>

<script>
    function setFindType(value) {
        document.getElementById("findType").value = value;
        document.getElementById("selectedOption").textContent = value;
    }
</script>

<script>
    document.getElementById("submitBtn").addEventListener("click", async function () {
        let selectedSkins = [];

        // Loop through all checked checkboxes
        document.querySelectorAll("input[name='caseIds']:checked").forEach((checkbox) => {
            selectedSkins.push({
                id: checkbox.value,
                name: checkbox.closest(".card-body").querySelector(".card-title").innerText
            });
        });

        // Debugging: Print JSON before sending
        console.log("Request Body:", JSON.stringify(selectedSkins, null, 2));

        // Send JSON request using Fetch API
        await fetch("/search/steam/skins?wearName=" + document.getElementById("findType").value, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(selectedSkins) // Convert JS object to JSON
        })
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(error => console.error("Error:", error));
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

<footer class="text-center py-3 bg-light">
    <p>&copy; 2023 Skin Scraper App</p>
</footer>
</body>
</html>
